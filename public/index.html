<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobooth</title>
  <link rel="stylesheet" href="/vendor/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="backgrounds"></div>
    <div id="viewport">
      <div id="video-box">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="live-canvas"></canvas>
      </div>
      <canvas id="compositor" hidden></canvas>
      <div id="countdown"></div>
      <div id="flash"></div>
      <div id="preview" hidden>
        <img id="preview-img" alt="Captured photo">
        <div id="preview-actions">
          <button id="btn-save"><i class="bi bi-check-lg"></i> Save</button>
          <button id="btn-print"><i class="bi bi-printer"></i> Print</button>
          <button id="btn-cancel"><i class="bi bi-x-lg"></i> Discard</button>
        </div>
      </div>
    </div>
    <div id="settings">
      <button id="btn-mirror" class="setting-btn" title="Mirror mode (M)">
        <i class="bi bi-arrow-left-right"></i>
      </button>
      <div id="countdown-setting">
        <button class="cd-btn active" data-duration="3">3s</button>
        <button class="cd-btn" data-duration="5">5s</button>
        <button class="cd-btn" data-duration="10">10s</button>
      </div>
      <button id="btn-strip" class="setting-btn" title="Photo strip (T)">
        <i class="bi bi-grid"></i>
      </button>
      <div id="camera-picker-wrap">
        <button id="btn-camera" class="setting-btn" title="Webcam">
          <i class="bi bi-camera-video"></i>
        </button>
        <div id="camera-dropdown" hidden></div>
      </div>
    </div>
    <button id="capture"></button>
    <div id="toasts"></div>
  </div>
  <footer>
    <p><a href="https://github.com/xavier-opencode/photobooth">GitHub</a> &middot; Photobooth &copy; 2026 &middot; <a href="https://giwi.fr">GiwiSoft</a></p>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
