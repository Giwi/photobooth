<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobooth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="backgrounds"></div>
    <div id="viewport">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="live-canvas"></canvas>
      <canvas id="compositor" hidden></canvas>
      <div id="countdown"></div>
      <div id="flash"></div>
      <div id="preview" hidden>
        <img id="preview-img" alt="Captured photo">
        <div id="preview-actions">
          <button id="btn-save">✓ Save</button>
          <button id="btn-print">🖨 Print</button>
          <button id="btn-cancel">✕ Discard</button>
        </div>
      </div>
    </div>
    <div id="settings">
      <button id="btn-mirror" class="setting-btn" title="Mirror mode (M)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16l-4-4 4-4"/><path d="M17 8l4 4-4 4"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
      </button>
      <div id="countdown-setting">
        <button class="cd-btn active" data-duration="3">3s</button>
        <button class="cd-btn" data-duration="5">5s</button>
        <button class="cd-btn" data-duration="10">10s</button>
      </div>
      <button id="btn-strip" class="setting-btn" title="Photo strip (T)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="5" rx="1"/><rect x="4" y="9.5" width="16" height="5" rx="1"/><rect x="4" y="17" width="16" height="5" rx="1"/></svg>
      </button>
      <div id="camera-picker-wrap">
        <button id="btn-camera" class="setting-btn" title="Webcam">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        </button>
        <div id="camera-dropdown" hidden></div>
      </div>
    </div>
    <button id="capture"></button>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
